[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-backend"
version = "0.1.0"
description = "AURA backend service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aio-pika>=9.5.4",
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.115.6",
  "greenlet>=3.1.1",
  "orjson>=3.10.12",
  "prometheus-client>=0.21.0",
  "psutil>=6.1.1",
  "pydantic-settings>=2.7.0",
  "python-json-logger>=3.2.1",
  "redis>=5.2.1",
  "sqlalchemy>=2.0.36",
  "starlette>=0.46.0",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "black>=24.10.0",
  "httpx>=0.28.1",
  "isort>=5.13.2",
  "mypy>=1.14.0",
  "pre-commit>=4.0.1",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.8.4",
  "types-psutil>=7.0.0.20250601"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
format.quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = []
